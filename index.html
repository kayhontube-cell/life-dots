<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Моя жизнь">
<link rel="manifest" href="manifest.json">
<title>Моя жизнь</title>
<style>
:root{--red:#ff3b30;--white:#f5f5f7;--muted:#8e8e93;--panel:#151515}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{width:min(940px,100%);margin:auto;padding:28px 16px 60px}h1{font-size:38px;letter-spacing:-1.5px;margin:8px 0 4px}.desc{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid #262626;border-radius:24px;padding:18px}#setup{max-width:480px;margin:12vh auto}
label{font-size:14px;color:#bbb;display:block;margin:18px 0 8px}input{appearance:none;width:100%;border:1px solid #383838;background:#0b0b0b;color:#fff;padding:15px;border-radius:14px;font:inherit;color-scheme:dark}
button{font:inherit;border:0;cursor:pointer}.save{width:100%;background:var(--red);color:#fff;font-weight:700;padding:15px;border-radius:14px;margin-top:12px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:#242424;border-radius:14px;padding:4px}.switch button{padding:10px;border-radius:11px;background:transparent;color:#aaa}.switch .active{background:#fff;color:#111;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{background:#0b0b0b;border-radius:15px;padding:13px}.stat strong{display:block;font-size:21px}.stat small{color:#8e8e93}
.track{height:7px;background:#333;border-radius:20px;overflow:hidden;margin-top:15px}.track div{height:100%;background:var(--red)}
.legend{display:flex;gap:20px;color:#aaa;font-size:13px;margin:18px 3px 13px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--white);margin-right:6px}.legend .r{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6px,1fr));gap:5px}.dot{aspect-ratio:1;border-radius:50%;background:var(--white)}.dot.past{background:var(--red)}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:#777;font-size:13px;gap:12px}.actions{display:flex;gap:12px}.change{background:none;color:#aaa;text-decoration:underline;padding:8px}.hidden{display:none!important}
@media(max-width:560px){main{padding-left:13px;padding-right:13px}h1{font-size:32px}.card{padding:14px;border-radius:19px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.grid{grid-template-columns:repeat(auto-fill,minmax(4px,1fr));gap:3px}.bottom{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:space-between}}
</style></head>
<body><main>
<section id="setup" class="card hidden"><h1>Моя жизнь</h1><p class="desc">Создай свою карту жизни.</p>
<label>Дата рождения</label><input id="birth" type="date">
<label>До какого возраста показать жизнь?</label><input id="target" type="number" min="1" max="150" value="70" inputmode="numeric">
<button class="save" id="save">Создать карту жизни</button></section>
<section id="app" class="hidden">
<h1>Моя жизнь</h1><p class="desc" id="birthday"></p>
<div class="card"><div class="switch"><button id="weekBtn" class="active">Недели</button><button id="dayBtn">Дни</button></div>
<div class="stats"><div class="stat"><strong id="lived"></strong><small id="livedTxt"></small></div><div class="stat"><strong id="left"></strong><small id="leftTxt"></small></div><div class="stat"><strong id="pct"></strong><small id="pctTxt"></small></div></div>
<div class="track"><div id="progress"></div></div></div>
<div class="legend"><span><i class="r"></i>Прожито</span><span><i></i>Впереди</span></div><div class="grid" id="grid"></div>
<div class="bottom"><span id="goalText"></span><div class="actions"><button class="change" id="ageChange">Изменить возраст</button><button class="change" id="birthChange">Изменить дату</button></div></div>
</section></main>
<script>
const BKEY="lifeDots.birth.v1", AKEY="lifeDots.targetAge.v1";let mode="weeks";const q=x=>document.getElementById(x);
const parse=s=>{let[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)};const days=(a,b)=>Math.max(0,Math.floor((b-a)/86400000));
function targetAge(){return Math.max(1,Math.min(150,parseInt(localStorage.getItem(AKEY)||"70")||70))}
function render(){const s=localStorage.getItem(BKEY);q("setup").classList.toggle("hidden",!!s);q("app").classList.toggle("hidden",!s);if(!s)return;
 const age=targetAge(),b=parse(s),now=new Date(),end=new Date(b.getFullYear()+age,b.getMonth(),b.getDate(),12);if(b>now){localStorage.removeItem(BKEY);return render()}
 const td=Math.max(1,days(b,end)),actual=Math.max(0,days(b,now)),ld=Math.min(td,actual),total=mode==="weeks"?Math.ceil(td/7):td,lived=Math.min(total,mode==="weeks"?Math.floor(ld/7):ld),p=Math.min(100,ld/td*100);
 q("birthday").textContent="Дата рождения: "+b.toLocaleDateString("ru-RU");q("lived").textContent=lived.toLocaleString("ru-RU");q("left").textContent=(total-lived).toLocaleString("ru-RU");q("pct").textContent=p.toFixed(1)+"%";
 q("livedTxt").textContent=mode==="weeks"?"недель прожито":"дней прожито";q("leftTxt").textContent=mode==="weeks"?"недель осталось":"дней осталось";q("pctTxt").textContent="жизни до "+age+" лет";q("goalText").textContent=age+" лет = вся карта";q("progress").style.width=p+"%";
 let f=document.createDocumentFragment();for(let i=0;i<total;i++){let e=document.createElement("i");e.className="dot"+(i<lived?" past":"");f.appendChild(e)}q("grid").replaceChildren(f)}
q("save").onclick=()=>{let b=q("birth").value,a=parseInt(q("target").value);if(!b)return alert("Укажи дату рождения");if(!a||a<1||a>150)return alert("Укажи возраст от 1 до 150");localStorage.setItem(BKEY,b);localStorage.setItem(AKEY,String(a));render()};
q("birthChange").onclick=()=>{let v=localStorage.getItem(BKEY)||"";localStorage.removeItem(BKEY);render();q("birth").value=v;q("target").value=targetAge()};
q("ageChange").onclick=()=>{let old=targetAge(),v=prompt("До какого возраста показать жизнь?",old);if(v===null)return;let a=parseInt(v);if(!a||a<1||a>150)return alert("Укажи число от 1 до 150");localStorage.setItem(AKEY,String(a));render()};
q("weekBtn").onclick=()=>{mode="weeks";q("weekBtn").classList.add("active");q("dayBtn").classList.remove("active");render()};q("dayBtn").onclick=()=>{mode="days";q("dayBtn").classList.add("active");q("weekBtn").classList.remove("active");render()};render();
</script></body></html>
